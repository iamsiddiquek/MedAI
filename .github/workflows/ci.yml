name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "25", cache: maven}
      # Unit tests plus integration tests against PostgreSQL in Testcontainers.
      - run: mvn -B -ntp verify

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [model-gateway, ambient-ai]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Install
        run: |
          pip install -e "services/model-gateway[dev]"
          pip install -e "services/ambient-ai" ruff pytest
      - run: ruff check services/${{ matrix.service }}
      - run: pytest -q
        working-directory: services/${{ matrix.service }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency and configuration scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Feature register is valid YAML with unique ids
        run: |
          pip install pyyaml
          python - <<'PY'
          import yaml
          rows = yaml.safe_load(open("docs/features/register.yaml"))["features"]
          ids = [r["id"] for r in rows]
          assert len(ids) == len(set(ids)), "duplicate ids"
          print(len(rows), "rows")
          PY
