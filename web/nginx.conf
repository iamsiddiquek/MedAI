server {
  listen 8080;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:8080 http://localhost:8180; frame-ancestors 'none'; base-uri 'self'" always;
  location / { try_files $uri /index.html; }
}
