[project]
name = "afia-ambient-ai"
version = "0.1.0"
description = "Afia ambient-ai: turns a completed recording into a transcript and a grounded draft note"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "boto3>=1.34",
    "aiokafka>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]  # tests also import ../model-gateway (see pythonpath)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../model-gateway"]

[tool.ruff]
line-length = 110

[tool.setuptools.packages.find]
include = ["ambient_ai*"]
